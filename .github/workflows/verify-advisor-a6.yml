name: Advisor A6 - appliance bay swaps

on:
  push:
    branches:
      - 'advisor/a6-appliance-bay-swap-20261008'
    paths:
      - 'scripts/prepare-advisor-a6-tall-bays.mjs'
      - '.github/workflows/verify-advisor-a6.yml'
  pull_request:
    paths:
      - 'scripts/prepare-advisor-a6-tall-bays.mjs'
      - '.github/workflows/verify-advisor-a6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-kitchen-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prove A5 simultaneous user scenarios unchanged
        run: node scripts/advisor-a5-kitchen-scenarios.mjs
      - name: Compare exact K12 versus swapped oven and fridge with no new canonical fails
        run: node scripts/prepare-advisor-a6-tall-bays.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: advisor-a6-bay-clearance-and-storage-tradeoffs
          path: design-development/advisor/a6/
          retention-days: 14
          if-no-files-found: error

  visual-spot-check:
    needs: critical-kitchen-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --only-shell chromium
      - run: npm run build
      - run: node scripts/prepare-advisor-a6-tall-bays.mjs > /tmp/advisor-a6-geometry.json
      - name: Render original K12 from 3 fixed cameras
        env:
          RENDER_OUT_DIR: renders/control
        run: node scripts/render-snapshot.mjs design-development/advisor/a6/k12-control.json
      - name: Render oven/fridge swap from identical cameras
        env:
          RENDER_OUT_DIR: renders/swap
        run: node scripts/render-snapshot.mjs design-development/advisor/a6/oven-fridge-swap.json
      - name: Upload immutable K12/A6 comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisor-a6-kitchen-bay-renders
          path: renders/
          retention-days: 14
          if-no-files-found: error
