name: Whole-home M0 source inventory contracts
on:
  push:
    branches: [integration/owner-review-gates-r1-20261010]
    paths: [scripts/build-whole-home-m0.mjs, scripts/whole-home-m0.test.mjs, design-development/whole-home-m0/**, .github/workflows/whole-home-m0.yml]
  pull_request:
    paths: [scripts/build-whole-home-m0.mjs, scripts/whole-home-m0.test.mjs, design-development/whole-home-m0/**, .github/workflows/whole-home-m0.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/build-whole-home-m0.mjs
      - run: node --test --test-isolation=none scripts/whole-home-m0.test.mjs studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs
      - run: git diff --exit-code -- design-development/whole-home-m0
      - uses: actions/upload-artifact@v4
        with:
          name: type-b-whole-home-m0-review
          path: design-development/whole-home-m0/
