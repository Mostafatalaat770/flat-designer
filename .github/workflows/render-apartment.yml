name: Render Apartment

on:
  push:
    branches:
      - "**"
    paths:
      - "render-snapshots/current.json"
      - "scripts/render-snapshot.mjs"
      - ".github/workflows/render-apartment.yml"
      - "capture-renderer.js"
      - "scripts/verify-render-overlay.mjs"
      - "build_capture.mjs"
      - "make_app.py"
      - "generate_model.py"
      - "scene-decor.js"
      - "studio-core.js"
      - "studio-scene.js"
      - "studio/renderer/builders.js"
      - "studio-catalog.json"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Snapshot JSON path"
        required: false
        default: "render-snapshots/current.json"

permissions:
  contents: read

concurrency:
  group: apartment-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: npm ci

      - name: Install headless Chromium
        timeout-minutes: 5
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --only-shell chromium

      - name: Build exact Studio capture template
        run: npm run build

      - name: Verify render-only finish repairs
        run: node scripts/verify-render-overlay.mjs

      - name: Render branch snapshot
        env:
          SNAPSHOT_PATH: ${{ github.event.inputs.snapshot || 'render-snapshots/current.json' }}
        run: node scripts/render-snapshot.mjs "$SNAPSHOT_PATH"

      - name: Render K11 removable-cover preparation mode
        if: github.ref == 'refs/heads/design/k11-kitchen-daily-use'
        env:
          RENDER_OUT_DIR: renders/prep-mode
        run: node scripts/render-snapshot.mjs design-development/k11/prep-mode.json

      - name: Render K12 standing end-prep view
        if: github.ref == 'refs/heads/design/k12-permanent-end-prep'
        env:
          RENDER_OUT_DIR: renders/end-prep
        run: node scripts/render-snapshot.mjs design-development/k12/end-prep-view.json

      - name: Render frozen K11 comparison
        if: github.ref == 'refs/heads/design/k12-permanent-end-prep'
        env:
          RENDER_OUT_DIR: renders/comparison-K11
        run: node scripts/render-snapshot.mjs design-development/k12/k11-comparison.json

      - name: Upload PNGs and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apartment-renders-${{ github.run_id }}-${{ github.sha }}
          path: renders/
          if-no-files-found: error
          retention-days: 14

