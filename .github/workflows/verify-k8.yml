name: Verify K8 Render Repairs

on:
  push:
    branches:
      - "design/k8-bound-finishes-review"
    paths:
      - "*.js"
      - "*.mjs"
      - "*.py"
      - "scripts/**"
      - "render-snapshots/current.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Manual historical review must load the study's own code and source.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && '277d6f60ad480879122ea8d76c4943c6732b3d20' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Core verification
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run check
      - name: Architectural candidate validation
        run: node scripts/validate-architectural-snapshot.mjs
      - name: Render overlay regression checks
        run: node scripts/verify-render-overlay.mjs
      - name: Domain study tests
        run: npm run check:study
      - name: Provide canonical renderer fixture
        run: cp studio/app/data/family-a7.brief.json studio/app/data/workspace-seed.json
      - name: Studio renderer/domain tests
        run: npm run check:studio
      - name: Architecture-lock note
        run: echo "Canonical Studio geometry guards remain intact; K8 architecture is still reviewed render-only study data."
