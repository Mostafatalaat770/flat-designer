name: Verify K12 Permanent End Prep Study

on:
  push:
    branches:
      - "design/k12-permanent-end-prep"
    paths:
      - "*.js"
      - "*.mjs"
      - "*.py"
      - "scripts/**"
      - "studio/**"
      - "design-development/k12/**"
      - "render-snapshots/current.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Core verification
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run check
      - name: Reproduce K12 from frozen K11
        run: |
          cp -r design-development/k12 /tmp/k12-frozen
          node scripts/prepare-k12-kitchen.mjs design-development/k11/snapshot.json
          for f in snapshot.json end-prep-view.json k11-comparison.json function-audit.json storage-allocation.json; do
            diff -u "/tmp/k12-frozen/$f" "design-development/k12/$f"
          done
          cmp design-development/k12/snapshot.json render-snapshots/current.json
      - name: Disclosed architectural study validation
        run: node scripts/validate-architectural-snapshot.mjs
      - name: Render overlay regression checks
        run: node scripts/verify-render-overlay.mjs
      - name: Domain study tests
        run: npm run check:study
      - name: Provide canonical renderer fixture
        run: cp studio/app/data/family-a7.brief.json studio/app/data/workspace-seed.json
      - name: Actual Studio mesh and domain tests
        run: npm run check:studio
