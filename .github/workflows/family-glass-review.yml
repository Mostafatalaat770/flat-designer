name: Family shower F1 · source-locked minimal glass and daily use
on:
  pull_request:
    branches: [master]
    paths:
      - "studio-scene.js"
      - "studio-core.js"
      - "studio/renderer/builders.js"
      - "studio/renderer/walk-in-shower.test.mjs"
      - "studio/analysis/family-glass-study*"
      - "scripts/build-family-glass-review.mjs"
      - ".github/workflows/family-glass-review.yml"
      - "design-development/FAMILY_SHOWER_MINIMAL_GLASS_20261010.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparative-render:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Strict original-room identity, fixture validation and renderer parity
        run: node --test studio/analysis/family-glass-study.test.mjs studio/renderer/walk-in-shower.test.mjs studio/local/current-baseline.test.mjs
      - name: Two identical-view candidate scenes and functional gap diagram
        run: node scripts/build-family-glass-review.mjs
      - name: Install Chromium WebGL renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: A - current dark framed enclosure from two family cameras
        env:
          RENDER_OUT_DIR: renders/family-shower/A
          RENDER_CONCURRENCY: "1"
        run: node scripts/render-snapshot.mjs review-evidence/family-shower-glass/A-original.json
      - name: B - corrected clear glass orientation and slender trial base, same cameras
        env:
          RENDER_OUT_DIR: renders/family-shower/B
          RENDER_CONCURRENCY: "1"
        run: node scripts/render-snapshot.mjs review-evidence/family-shower-glass/B-minimal-glass.json
      - name: Confirm real PNGs, source scenes, camera and renderer metadata
        run: |
          node --input-type=module -e "import fs from 'node:fs';import assert from 'node:assert/strict';const p='review-evidence/family-shower-glass/';const A=JSON.parse(fs.readFileSync(p+'A-original.json'));const B=JSON.parse(fs.readFileSync(p+'B-minimal-glass.json'));assert.deepEqual(A.views,B.views);assert.equal(A.layout.furniture.find(f=>f.id==='starter-16').variant,'style');assert.equal(B.layout.furniture.find(f=>f.id==='starter-16').variant,'minimal-glass');for(const side of ['A','B']){const sc=side==='A'?A:B;const path='renders/family-shower/'+side+'/';const m=JSON.parse(fs.readFileSync(path+'manifest.json'));assert.equal(m.scene_revision,sc.scene_revision);assert.deepEqual(m.views,sc.views.map(v=>v.id));for(const view of sc.views){const file=path+view.id;assert.ok(fs.statSync(file+'.png').size>15000);const meta=JSON.parse(fs.readFileSync(file+'.json'));assert.equal(meta.scene_revision,sc.scene_revision);assert.equal(meta.renderer.engine,'Three.js WebGL');assert.equal(meta.assets.pending,0);assert.deepEqual(meta.assets.fallbacks,[]);assert.deepEqual(meta.camera.position,view.camera.position);assert.deepEqual(meta.camera.target,view.camera.target)}}console.log('Four source-faithful real WebGL frames verified');"
      - name: Upload A/B visuals and geometric/first-fix HOLD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-shower-minimal-glass-900mm-study
          path: |
            renders/family-shower/
            review-evidence/family-shower-glass/
          if-no-files-found: warn
          retention-days: 30
