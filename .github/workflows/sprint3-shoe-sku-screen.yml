name: Sprint 3 - shoe SKU source-locked operational screens
on:
  push:
    branches:
      - "design/sprint3-*"
  pull_request:
    branches:
      - design/sprint2-entry-operation-feasibility-20261010
    paths:
      - scripts/sprint3-shoe-sku-screen.mjs
      - design-development/reception-sprint3/**
      - .github/workflows/sprint3-shoe-sku-screen.yml
permissions:
  contents: read
jobs:
  verify-and-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Check source/owner/reception protections
        run: node --test studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs studio/analysis/reception-sprint.test.mjs
      - name: Generate exact shoe-SKU envelope study
        run: node scripts/sprint3-shoe-sku-screen.mjs
      - name: Verify baseline source and no architectural writes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          const d=JSON.parse(fs.readFileSync('design-development/reception-sprint3/SKU_SCREEN.json','utf8'));
          const source=fs.readFileSync('design-development/reception-sprint/A-P0.json');
          assert.equal(d.source.sha256,createHash('sha256').update(source).digest('hex'));
          assert.equal(d.source.scene,'scene-9e86635b');
          assert.equal(d.source.cloud_scene,'scene-4821689');
          assert.equal(d.products.length,4);
          assert.equal(d.baseline_source_proxy.shoe_user_to_six_chairs_mm,15);
          assert.equal(d.all_trials.length,4*17*4*2);
          assert.ok(d.all_trials.every(x=>typeof x.hypothetical_500mm_screen_pass==='boolean'));
          assert.equal(d.status,'EXPLORATORY_MODEL_ONLY');
          assert.ok(fs.statSync('design-development/reception-sprint3/SKU_SCREEN.svg').size>1000);
          JS
          git diff --exit-code -- render-snapshots/current.json design-development/reception-sprint/A-P0.json dist/sources
      - name: Upload calculations and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint3-real-product-entry-shoe-feasibility
          path: design-development/reception-sprint3/
          if-no-files-found: warn
          retention-days: 45
