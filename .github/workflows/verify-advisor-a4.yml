name: Advisor A4 - reception sideboard weight

on:
  push:
    branches:
      - 'advisor/a4-reception-sideboard-20261008'
  pull_request:
    paths:
      - 'scripts/prepare-advisor-a4-sideboard.mjs'
      - '.github/workflows/verify-advisor-a4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sideboard-alternatives:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install headless browser
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --only-shell chromium
      - run: npm run build
      - name: Verify sideboard experiment and canonical controls
        run: node scripts/prepare-advisor-a4-sideboard.mjs
      - name: Original dark walnut 2400 mm
        env:
          RENDER_OUT_DIR: renders/control-walnut
        run: node scripts/render-snapshot.mjs design-development/advisor/a4/original-walnut-2400.json
      - name: Light oak 2000 mm
        env:
          RENDER_OUT_DIR: renders/oak-2000
        run: node scripts/render-snapshot.mjs design-development/advisor/a4/muted-oak-2000.json
      - name: Light oak 1800 mm
        env:
          RENDER_OUT_DIR: renders/oak-1800
        run: node scripts/render-snapshot.mjs design-development/advisor/a4/muted-oak-1800.json
      - name: Publish true scene images and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advisor-a4-sideboard-evidence
          path: |
            renders/
            design-development/advisor/a4/metrics.json
          if-no-files-found: error
          retention-days: 14
