name: Verify Integrated Candidate

on:
  push:
    branches:
      - "design/j1-integrated-candidate"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Core verification
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run check
      - name: Architectural candidate validation
        run: node scripts/validate-architectural-snapshot.mjs
      - name: Domain study tests
        run: npm run check:study
      - name: Studio renderer/domain tests
        run: npm run check:studio
      - name: Architecture-lock note
        run: echo "studio:build/check:workspace intentionally remain canonical-only and reject J1's reviewed cross-room island; production guards are not weakened."
