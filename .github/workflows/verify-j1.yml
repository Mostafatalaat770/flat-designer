name: Verify Integrated Candidate

on:
  push:
    branches:
      - "design/j1-integrated-candidate"
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Core verification
        run: npm run check
      - name: Domain study tests
        run: npm run check:study
      - name: Asset tests
        run: npm run check:assets
      - name: Studio tests
        run: npm run check:studio
      - name: Workspace tests
        run: npm run check:workspace
