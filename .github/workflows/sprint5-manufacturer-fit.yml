name: Sprint 5 - manufacturer-dimensional kitchen constraints
on:
  push:
    branches: ["design/sprint5-*"]
  pull_request:
    branches: [design/sprint4-kitchen-operation-gates-20261010]
permissions:
  contents: read
jobs:
  manufacturer-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: node --test studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs studio/analysis/reception-sprint.test.mjs
      - run: node scripts/sprint5-manufacturer-kitchen-fit.mjs
      - name: Check source and generated evidence
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';import {createHash} from 'node:crypto';
          const r=JSON.parse(fs.readFileSync('design-development/reception-sprint5/MANUFACTURER_FIT.json','utf8'));
          const b=fs.readFileSync('design-development/reception-sprint/A-P0.json');
          assert.equal(r.source.sha256,createHash('sha256').update(b).digest('hex'));
          assert.equal(r.source.scene_revision,'scene-9e86635b');
          assert.equal(r.source.cloud_source,'scene-4821689');
          assert.equal(r.source.canonical_sha256,'734b1c36570f27baa930eec481eb109906a1f81684e6fb8f8b6a679fec2b9658');
          assert.equal(r.status,'REFERENCE_ONLY_DO_NOT_PROCURE');
          assert.equal(r.test_cases.length,36);
          assert.equal(r.source_box_screen_not_installed_clearance.washer_nominal_width_mm,0);
          assert.equal(r.source_box_screen_not_installed_clearance.dishwasher_nominal_width_mm,0);
          assert.equal(r.source_box_screen_not_installed_clearance.washer_open_extra_mm,440);
          assert.equal(r.source_box_screen_not_installed_clearance.fridge_open_extra_mm,499);
          assert.ok(r.release_gates.every(x=>x.status==='HOLD'));
          assert.ok(fs.statSync('design-development/reception-sprint5/FIT_AT_A_GLANCE.svg').size>1000);
          JS
          git diff --exit-code -- render-snapshots/current.json design-development/reception-sprint/A-P0.json dist/sources
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint5-vendor-exterior-size-sensitivity
          path: design-development/reception-sprint5/
          retention-days: 45
          if-no-files-found: warn
