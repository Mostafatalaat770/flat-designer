name: Reception Sprint - exact A B and conditional P0 P1 WebGL
on:
  pull_request:
    branches: [master]
    paths:
      - "studio/analysis/reception-sprint*"
      - "scripts/*reception-sprint*"
      - "design-development/reception-sprint/**"
      - ".github/workflows/reception-sprint-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-function-and-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - name: Validate immutable architecture, current decisions and operating-state regressions
        run: |
          npm run check
          node studio/local/workspace-data.mjs
          npm run check:studio
          node --test studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs studio/analysis/reception-sprint.test.mjs
      - name: Generate dimensioned plans, measured audits and four controlled snapshots
        run: node scripts/build-reception-sprint.mjs
      - name: Install existing Playwright WebGL capture runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render exactly matched A B styles on P0 and conditional P1
        env:
          RENDER_OUT_DIR: renders/reception-sprint
          RENDER_CONCURRENCY: "2"
        run: >-
          node scripts/render-variants.mjs
          design-development/reception-sprint/A-P0.json
          design-development/reception-sprint/B-P0.json
          design-development/reception-sprint/A-P1-CONDITIONAL.json
          design-development/reception-sprint/B-P1-CONDITIONAL.json
      - name: Verify actual PNGs, scene, exact camera, architecture overlay and image checksums; build contact sheets
        run: node scripts/verify-reception-sprint-renders.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reception-sprint-AB-P0-P1-source-locked-WebGL
          path: |
            renders/reception-sprint/
            design-development/reception-sprint/
          if-no-files-found: error
          retention-days: 30
