name: Kitchen R6 - functional light and joinery detail review
on:
  push:
    branches: [integration/owner-review-gates-r1-20261010]
    paths:
      - 'kitchen-r6-study.js'
      - 'make_app.py'
      - 'capture-renderer.js'
      - 'scripts/*kitchen-r6*'
      - 'scripts/render-variants.mjs'
      - 'design-development/kitchen-r6/**'
      - '.github/workflows/kitchen-r6-webgl-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-locked-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p work/kitchen-r6
      - run: npm ci
      - run: npm run build 2>&1 | tee work/kitchen-r6/build.log
      - run: npm run check 2>&1 | tee work/kitchen-r6/check.log
      - run: npm run check:studio 2>&1 | tee work/kitchen-r6/studio.log
      - run: node --test studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs studio/analysis/reception-sprint.test.mjs scripts/kitchen-r4-candidate.test.mjs scripts/kitchen-r5.test.mjs scripts/render-batch-plan.test.mjs 2>&1 | tee work/kitchen-r6/baseline-r4-r5.log
      - run: node scripts/verify-kitchen-finish-r4.mjs && node scripts/verify-p0-joinery-r3.mjs
      - run: node scripts/build-kitchen-r6.mjs 2>&1 | tee work/kitchen-r6/candidate-geometry.log
      - run: node --test scripts/kitchen-r6.test.mjs 2>&1 | tee work/kitchen-r6/r6-regression.log
      - run: npm install --no-save --package-lock=false playwright@1.58.2 && npx playwright install --with-deps chromium
      - name: Real WebGL source-locked comparison
        env:
          RENDER_OUT_DIR: renders/kitchen-r6
          RENDER_CONCURRENCY: '1'
        run: node scripts/render-variants.mjs design-development/kitchen-r6/L0.json design-development/kitchen-r6/L1.json design-development/kitchen-r6/L2.json design-development/kitchen-r6/L3.json design-development/kitchen-r6/L2-F1.json 2>&1 | tee work/kitchen-r6/final-render.log
      - name: Verify capture and offline review
        run: |
          node scripts/verify-kitchen-r6-renders.mjs 2>&1 | tee work/kitchen-r6/render-verification.log
          node --test scripts/kitchen-r6-render-verification.test.mjs 2>&1 | tee work/kitchen-r6/render-tests.log
          node scripts/export-kitchen-r6-review.mjs
          node scripts/verify-kitchen-r6-review.mjs 2>&1 | tee work/kitchen-r6/review-verification.log
          git diff --exit-code -- design-development/kitchen-r5 design-development/kitchen-finish-r4 design-development/reception-sprint/A-P0.json design-development/decision-registry.json render-snapshots/current.json dist/sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-r6-real-webgl-owner-review
          path: |
            renders/kitchen-r6/
            work/kitchen-r6/*.log
          retention-days: 90
          if-no-files-found: error
