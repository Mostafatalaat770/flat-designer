name: Agent branch verification

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run check
      - name: Build isolated React workspace from the pinned snapshot
        run: npm run studio:build
      - name: Verify local domains, assets, seed isolation and saved history
        run: npm run check:study && npm run check:studio && npm run check:workspace
