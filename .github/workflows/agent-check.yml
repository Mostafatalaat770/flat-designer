name: Agent branch verification

on:
  push:
    branches:
      - master
      - agent/furniture-surface-control
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install managed-runtime canvas shim for repository QA
        run: npm install --no-save @napi-rs/canvas@1.0.10
      - name: Build
        run: npm run build
      - name: Check
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: npm run check
