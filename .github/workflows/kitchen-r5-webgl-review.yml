name: Kitchen R5 - cabinet truth, door finishes and night review
on:
  push:
    branches: [integration/owner-review-gates-r1-20261010]
    paths:
      - 'kitchen-render-truth.js'
      - 'studio/renderer/builders.js'
      - 'make_app.py'
      - 'capture-renderer.js'
      - 'scripts/*kitchen-r5*'
      - 'design-development/kitchen-r5/**'
      - '.github/workflows/kitchen-r5-webgl-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-equivalent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p work/kitchen-r5
      - run: npm ci
      - run: npm run build 2>&1 | tee work/kitchen-r5/build.log
      - run: npm run check 2>&1 | tee work/kitchen-r5/check.log
      - run: npm run check:studio 2>&1 | tee work/kitchen-r5/studio.log
      - run: node --test studio/local/current-baseline.test.mjs studio/local/owner-decisions.test.mjs studio/analysis/reception-sprint.test.mjs 2>&1 | tee work/kitchen-r5/baseline.log
      - run: node scripts/verify-kitchen-finish-r4.mjs 2>&1 | tee work/kitchen-r5/r4-legacy.log
      - run: node scripts/verify-p0-joinery-r3.mjs 2>&1 | tee work/kitchen-r5/r3.log
      - run: node --test scripts/kitchen-r4-candidate.test.mjs scripts/render-batch-plan.test.mjs 2>&1 | tee work/kitchen-r5/r4-regression.log
      - name: Reproduce source authority audit and render experiments
        run: |
          node scripts/build-kitchen-r5.mjs 2>&1 | tee work/kitchen-r5/candidate-geometry.log
          git diff --exit-code -- design-development/kitchen-r5/GEOMETRY_AUDIT.json design-development/kitchen-r5/D0.json design-development/kitchen-r5/D1.json design-development/kitchen-r5/D2.json
          node --test scripts/kitchen-r5.test.mjs 2>&1 | tee work/kitchen-r5/r5-regression.log
      - name: Install capture runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Actual WebGL captures with identical cameras and fixed geometry
        env:
          RENDER_OUT_DIR: renders/kitchen-r5
          RENDER_CONCURRENCY: '1'
        run: node scripts/render-variants.mjs design-development/kitchen-r5/D0.json design-development/kitchen-r5/D1.json design-development/kitchen-r5/D2.json 2>&1 | tee work/kitchen-r5/full-render.log
      - name: Validate images, geometry evidence, doors, night cameras and offline delivery
        run: |
          node scripts/verify-kitchen-r5-renders.mjs 2>&1 | tee work/kitchen-r5/render-verification.log
          node --test scripts/kitchen-r5-render-verification.test.mjs 2>&1 | tee work/kitchen-r5/render-tests.log
          node scripts/export-kitchen-r5-review.mjs
          node scripts/verify-kitchen-r5-review.mjs 2>&1 | tee work/kitchen-r5/review-verification.log
          node scripts/export-kitchen-r5-review.mjs
          git diff --exit-code -- design-development/reception-sprint/A-P0.json design-development/kitchen-finish-r4 design-development/decision-registry.json render-snapshots/current.json dist/sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-r5-real-webgl-owner-review
          path: |
            renders/kitchen-r5/
            work/kitchen-r5/*.log
          retention-days: 90
          if-no-files-found: error
