ont-size="17">Reserve:4 pairs on2 shelves in existing WIC south bay</text><text x="550" y="598" font-size="15">550x350x400 study allocation; consumes clothing capacity</text><text x="550" y="631" font-size="15">No new hall unit; no shoe storage in food buffet</text><text x="30" y="777" font-size="15">Prototype dimensions and capacity are conditional design assumptions. Real slider, internal framing, wall fixing, tray and ventilation require validation.</text><text x="30" y="811" font-size="15">Rejected260mm angled prototype: length-only projection omitted shoe upper height. Final flat shelves use350mm overall depth and explicit3D shoe envelope.</text></g></svg>