executionPrerequisite: Dedicated Chromium CDP browser at 1600x857 and the isolated loopback QA server on 127.0.0.1:4174. Production disconnected.
steps:
  - tool: open-url
    args:
      url: http://127.0.0.1:4174/_qa/workspace/parity.html?view=family-v7-entry
  - await:
      visible: { id: ready-family-v7-entry }
      timeout: 15000
  - await: { idle: true }
  - snapshot: { name: family-v7-entry, maxMismatch: 0.1 }
